[net]
batch=1
subdivisions=1
width=768
height=768
channels=3
momentum=0.9
decay=0.0005

# Layer 0: huge spatial, very few filters
[convolutional]
filters=4
size=2
stride=1
pad=0
activation=leaky

# Optional downsample
[maxpool]
size=2
stride=2


# Layer 1: still high resolution, small filters
[convolutional]
filters=8
size=3
stride=1
pad=0
activation=leaky

# Optional downsample
[maxpool]
size=2
stride=2

# Layer 2: small spatial, more filters (GEMM will dominate here)
[convolutional]
filters=16
size=3
stride=1
pad=0
activation=leaky